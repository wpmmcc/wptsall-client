[package]
name = "mock-translate-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Crypto deps for signature verification
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md5 = "0.7"
jsonwebtoken = "9"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
form_urlencoded = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
md5 = "0.7"
hmac = "0.12"
sha2 = "0.10"
