[package]
name = "wptsall-desktop"
version = "2.1.1"
edition = "2021"
description = "WPTSALL translation client desktop application"
authors = ["WPMM <info@wpmm.cc>"]

[lib]
name = "wptsall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
wptsall-client = { path = "../../client-wpplugin/source" }
wptsall-client-security = { path = "../../libs/wptsall-client-security" }
client-runtime-core = { path = "../../libs/client-runtime-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
