[package]
name = "wptsall-client-security"
version = "0.1.0"
edition = "2021"
description = "Shared client security: release signing, device identity, anti-tamper"

[lib]
name = "wptsall_client_security"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
client-runtime-core = { path = "../client-runtime-core" }
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
hkdf = "0.12"
hmac = "0.12"
minisign = "0.7"
obfstr = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
mem-module = []
strict-antitamper = []
