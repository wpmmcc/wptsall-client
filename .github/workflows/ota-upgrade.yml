name: Secure OTA upgrade

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two lanes, both fully self-contained on public runners:
#
# ota-secure (matrix: ubuntu / windows / macos):
#   The update MECHANISM with an ephemeral in-job minisign keypair:
#   1. generate a throwaway keypair; build the client with that public key
#      embedded (build.rs WPTSALL_MINISIGN_PUBKEY — no real key ever
#      leaves its home: the public release key lives only in this
#      repository's Actions secret, the legacy host key only on the host);
#   2. assemble a kit with the exact release layout (bin + VERSION +
#      VERSION-BINARY + PLATFORM.txt) and serve a signed releases manifest
#      + signed kit from a local HTTP server;
#   3. positive round on EVERY OS: /api/update-check → /api/perform-update
#      → self-replace swaps the binary (rename-aside dance on Windows,
#      stage-aside + unlink + rename on Unix — Darwin refuses rename onto a
#      running executable) → cold start + /api/status. This exercises the
#      platform-specific self-replace helpers for real (perform_self_replace:
#      sh on Linux/macOS, PowerShell on Windows).
#   4. negatives + recovery (ubuntu leg only): missing kit signature,
#      tampered kit, bad manifest signature, read-only install dir
#      (INSTALL_DIR_NOT_WRITABLE, binary byte-identical), recovery round.
#
#   On Windows the self-replace helper restarts the swapped binary hidden
#   on the old port; the cold-start assertion uses a fresh port, so the
#   helper-restarted instance never interferes with the check.
#
# ota-github-public (ubuntu, skipped on fork PRs — needs release write):
#   The public update CHANNEL against real GitHub URLs: publish a
#   prerelease (tag ota-ci-<run id>) whose manifest and kit are signed with
#   the ephemeral key, then drive the client with WPTSALL_RELEASES_URL
#   pointing at the real releases.json asset URL — no local server at all.
#   update-check → perform-update → download from github.com (redirect to
#   the release CDN) → minisign verify → self-replace → cold start. The
#   prerelease is deleted again afterwards (always-cleanup). Afterwards a
#   default-channel smoke rebuilds the client WITHOUT the ephemeral key
#   (so the pinned public release key applies) and runs /api/update-check
#   with no source configured — asserting the out-of-the-box default
#   channel (releases/latest/download/releases.json) verifies against the
#   real published release, once one exists (skipped until then).

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ota-secure:
    name: Secure OTA round (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            negatives: true
          - os: windows-latest
            negatives: false
          - os: macos-latest
            negatives: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-wpplugin/source/frontend/package-lock.json

      - name: Build WebUI frontend
        working-directory: client-wpplugin/source/frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-wpplugin/source

      - name: Install minisign (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner image's google-chrome apt source (any file format,
          # list or deb822) intermittently hash-mismatches on dl.google.com
          # and kills apt-get update; nothing installed here needs it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome* || true
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v

      - name: Install minisign (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install minisign
          minisign -v

      - name: Install minisign (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          # Chocolatey ships minisign 0.8, which lacks `-W` (unencrypted
          # key) — the ephemeral keypair generation would die at the
          # password prompt. Building from source needs PkgConfig, which
          # the Windows runner lacks; use the official prebuilt 0.12 zip.
          url="https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          curl -fsSL "$url" -o "$RUNNER_TEMP/minisign.zip"
          unzip -o "$RUNNER_TEMP/minisign.zip" -d "$RUNNER_TEMP/minisign-bin"
          bin="$(find "$RUNNER_TEMP/minisign-bin" -name minisign.exe | head -n 1)"
          [ -n "$bin" ] || { echo "minisign.exe not found in the zip" >&2; exit 1; }
          cp "$bin" /usr/local/bin/minisign.exe
          minisign -v
          # Prove -W works before the real keygen step depends on it.
          minisign -G -W -p "$RUNNER_TEMP/check.pub" -s "$RUNNER_TEMP/check.key"
          rm -f "$RUNNER_TEMP/check.pub" "$RUNNER_TEMP/check.key"
          echo "minisign -W capable"

      - name: Resolve python (portable across the three runner OSes)
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          [ -n "$PY" ] || { echo "no python on PATH" >&2; exit 1; }
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" --version

      - name: Generate ephemeral signing keypair
        run: |
          set -euo pipefail
          minisign -G -W -p "$RUNNER_TEMP/ota.pub" -s "$RUNNER_TEMP/ota.key"
          # The pubkey file's RW... line is the pure base64 body that
          # PublicKey::from_base64 expects (same shape as the pinned key).
          pubkey="$(grep -m1 '^RW' "$RUNNER_TEMP/ota.pub")"
          echo "embedded pubkey: $pubkey"
          echo "WPTSALL_MINISIGN_PUBKEY=$pubkey" >> "$GITHUB_ENV"

      - name: Release build with embedded ephemeral key
        run: cargo build --release --bin wptsall-client --manifest-path client-wpplugin/source/Cargo.toml

      - name: Assemble install root, kit, manifest, and local releases server
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ota.key"
          work="$RUNNER_TEMP/ota"
          rm -rf "$work" && mkdir -p "$work/http" "$work/install/bin" "$work/install/ui/webui"
          version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          plat="$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]' \
            | sed 's/macos/darwin/;s/x64/x86_64/;s/arm64/aarch64/')"
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          echo "OTA_EXE=$ext" >> "$GITHUB_ENV"
          echo "OTA_PLAT=$plat" >> "$GITHUB_ENV"

          # Install root the client runs from (self-replace target).
          cp "client-wpplugin/source/target/release/wptsall-client$ext" "$work/install/bin/"
          echo "$version" > "$work/install/VERSION-WEBUI"
          cp -r client-wpplugin/source/frontend/dist/. "$work/install/ui/webui/"

          # Binary kit exactly like the release layout: <kit_root>/bin/...
          # Tar paths stay relative: Windows bsdtar treats absolute D:\...
          # arguments as host:file remotes ("Cannot connect to D:").
          kit_root="wptsall-client-webui"
          mkdir -p "$work/$kit_root/bin"
          cp "client-wpplugin/source/target/release/wptsall-client$ext" "$work/$kit_root/bin/"
          echo "$version" > "$work/$kit_root/VERSION"
          echo "$version" > "$work/$kit_root/VERSION-BINARY"
          echo "$plat" > "$work/$kit_root/PLATFORM.txt"
          ( cd "$work" && tar -czf "http/kit-webui-$plat.tar.gz" "$kit_root" )
          kit="$work/http/kit-webui-$plat.tar.gz"
          minisign -Sm "$kit" -s "$key" -x "$kit.minisig"

          # Signed SHA256SUMS (python so the step is identical on all OSes).
          # NOTE: every `python -c` stays single-line — YAML strips only the
          # block base indent, so a continuation line indented deeper (e.g.
          # inside a loop) would leak spaces into the python source.
          sums="$work/http/RELEASE-SHA256SUMS-webui.txt"
          hash="$("$PY" -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$kit")"
          printf '%s  %s\n' "$hash" "kit-webui-$plat.tar.gz" > "$sums"
          minisign -Sm "$sums" -s "$key" -x "$sums.minisig"

          # Releases manifest: raw data object, canonicalized and signed the
          # same way the release-publish workflow signs the public channel
          # (sorted keys, compact JSON).
          port="$("$PY" -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          echo "OTA_SERVER_PORT=$port" >> "$GITHUB_ENV"
          data="$work/releases-data.json"
          "$PY" - "$data" "$port" "$plat" <<'PY'
          import json, sys
          out, port, plat = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          data = {
            "schema_version": 1,
            "generated_at": "2026-09-08T00:00:00Z",
            "products": {
              "client-wpplugin": {
                "latest_version": "99.0.0",
                "min_supported_version": "2.0.0",
                "release_notes_url": f"http://127.0.0.1:{port}/notes",
                "download_url_template": f"http://127.0.0.1:{port}/kit-webui-{plat}.tar.gz",
                "signature_url_template": f"http://127.0.0.1:{port}/RELEASE-SHA256SUMS-webui.txt.minisig",
                "mandatory": False,
              }
            },
          }
          json.dump(data, open(out, "w"), indent=2)
          PY
          canon="$work/releases-canonical.json"
          "$PY" - "$data" "$canon" <<'PY'
          import json, sys
          def sortv(v):
            if isinstance(v, dict): return {k: sortv(v[k]) for k in sorted(v)}
            if isinstance(v, list): return [sortv(i) for i in v]
            return v
          raw = json.loads(open(sys.argv[1]).read())
          open(sys.argv[2], "wb").write(json.dumps(
            sortv(raw), ensure_ascii=False, separators=(",", ":"), allow_nan=False
          ).encode("utf-8"))
          PY
          minisign -Sm "$canon" -s "$key" -x "$work/releases-data.json.minisig"
          ls -la "$work/http" "$work"

      - name: Serve local releases endpoint
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ota/serve.py" <<'PY'
          import http.server, json, os
          HTTP_DIR = os.environ["OTA_HTTP_DIR"]
          DATA = os.environ["OTA_RELEASES_DATA"]
          SIG = os.environ["OTA_RELEASES_SIG"]
          class H(http.server.SimpleHTTPRequestHandler):
            def __init__(self, *a, **kw):
              super().__init__(*a, directory=HTTP_DIR, **kw)
            def _raw(self, body, ctype):
              self.send_response(200)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
            def do_GET(self):
              if self.path == "/api/v1/client/releases":
                # Same wire shape as the public channel and the local OTA
                # suite: the manifest data object wrapped in
                # {"success":true,"data":...}. The updater extracts
                # body["data"]; the .minisig covers the canonicalized inner
                # data object, not this wrapper.
                data = json.load(open(DATA, encoding="utf-8"))
                self._raw(json.dumps({"success": True, "data": data}).encode(), "application/json")
              elif self.path == "/api/v1/client/releases.minisig":
                self._raw(open(SIG, "rb").read(), "application/octet-stream")
              else:
                super().do_GET()
            def log_message(self, *a):
              pass
          port = int(__import__("sys").argv[1])
          http.server.ThreadingHTTPServer(("127.0.0.1", port), H).serve_forever()
          PY
          OTA_HTTP_DIR="$RUNNER_TEMP/ota/http" \
          OTA_RELEASES_DATA="$RUNNER_TEMP/ota/releases-data.json" \
          OTA_RELEASES_SIG="$RUNNER_TEMP/ota/releases-data.json.minisig" \
            "$PY" "$RUNNER_TEMP/ota/serve.py" "$OTA_SERVER_PORT" \
            > "$RUNNER_TEMP/ota/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ota/serve.pid"
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$OTA_SERVER_PORT/api/v1/client/releases" \
              -o "$RUNNER_TEMP/ota/ready.json" 2>/dev/null \
              && grep -q client-wpplugin "$RUNNER_TEMP/ota/ready.json"; then
              echo "releases server up on $OTA_SERVER_PORT"; exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/ota/serve.log" || true
          echo "releases server failed to start" >&2; exit 1

      - name: Positive round - signed manifest + signed kit self-replace
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          home="$ota/pos"
          rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18131
          bin="$ota/install/bin/wptsall-client$OTA_EXE"
          # mtime of the pre-swap binary; the -1 arm guards the millisecond
          # window mid-swap where unlink+rename leaves the path absent (a
          # bare ENOENT would abort the step under `set -e`).
          before_mtime="$("$PY" -c 'import os,sys; print(int(os.stat(p).st_mtime) if os.path.exists(p:=sys.argv[1]) else -1)' "$bin")"
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$bin" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          [ "$ready" = "1" ] || { cat "$home/stdout.log" "$home/client.log" 2>/dev/null || true; \
            echo "client did not start (security gate must be active)" >&2; exit 1; }

          check="$(curl -fsS "http://127.0.0.1:$ui_port/api/update-check")"
          echo "update-check: $check"
          echo "$check" | grep -q '"update_available":true' \
            || { echo "expected update_available true" >&2; exit 1; }

          code="$(curl -sS -o "$home/perform.json" -w '%{http_code}' -X POST \
            "http://127.0.0.1:$ui_port/api/perform-update" || true)"
          echo "perform-update HTTP $code: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            || { echo "secure perform-update did not succeed" >&2; exit 1; }

          # The self-replace helper swaps the staged binary after the
          # response; wait for the install-root binary mtime to move.
          swapped=0
          for _ in $(seq 1 60); do
            now_mtime="$("$PY" -c 'import os,sys; print(int(os.stat(p).st_mtime) if os.path.exists(p:=sys.argv[1]) else -1)' "$bin")"
            if [ "$now_mtime" != "$before_mtime" ] && [ "$now_mtime" != "-1" ]; then swapped=1; break; fi
            sleep 0.5
          done
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          [ "$swapped" = "1" ] \
            || { echo "self-replace did not swap the staged binary" >&2; exit 1; }

          # The replaced binary must be runnable: cold start + status.
          # (On Windows the helper also restarts the swapped binary hidden
          # on the old port; this cold start uses a fresh port.)
          ui_port=18132
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$bin" > "$home/stdout2.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          [ "$ready" = "1" ] || { cat "$home/stdout2.log" "$home/client.log" 2>/dev/null || true; \
            echo "replaced binary failed to start" >&2; exit 1; }
          echo "PASS: secure OTA positive on $RUNNER_OS (self-replace verified, cold start ok)"

      - name: Negative - missing kit signature must be rejected
        if: matrix.negatives
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          rm -f "$ota/http/kit-webui-$OTA_PLAT.tar.gz.minisig" \
                "$ota/http/RELEASE-SHA256SUMS-webui.txt.minisig"
          home="$RUNNER_TEMP/ota/neg-nosig"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18133
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sS -o "$home/perform.json" -X POST "http://127.0.0.1:$ui_port/api/perform-update" || true
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          echo "neg missing-sig: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            && { echo "missing kit .minisig must not succeed" >&2; exit 1; }
          echo "PASS: missing kit signature rejected"

      - name: Negative - tampered kit must be rejected
        if: matrix.negatives
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          minisign -Sm "$ota/http/kit-webui-$OTA_PLAT.tar.gz" -s "$RUNNER_TEMP/ota.key" \
            -x "$ota/http/kit-webui-$OTA_PLAT.tar.gz.minisig"
          minisign -Sm "$ota/http/RELEASE-SHA256SUMS-webui.txt" -s "$RUNNER_TEMP/ota.key" \
            -x "$ota/http/RELEASE-SHA256SUMS-webui.txt.minisig"
          "$PY" -c "
          from pathlib import Path
          p = Path('$ota/http/kit-webui-$OTA_PLAT.tar.gz')
          b = bytearray(p.read_bytes())
          b[64:96] = b'\xff' * 32
          p.write_bytes(b)
          "
          home="$RUNNER_TEMP/ota/neg-badkit"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18134
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sS -o "$home/perform.json" -X POST "http://127.0.0.1:$ui_port/api/perform-update" || true
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          echo "neg tampered-kit: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            && { echo "tampered kit must not succeed" >&2; exit 1; }
          echo "PASS: tampered kit rejected"

      - name: Negative - bad releases manifest signature must be rejected
        if: matrix.negatives
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          # Restore the good kit, then break the manifest signature.
          ota_kit="$ota/http/kit-webui-$OTA_PLAT.tar.gz"
          rm -f "$ota_kit"
          kit_root="wptsall-client-webui"
          ( cd "$RUNNER_TEMP/ota" && tar -czf "http/$(basename "$ota_kit")" "$kit_root" )
          minisign -Sm "$ota_kit" -s "$RUNNER_TEMP/ota.key" -x "$ota_kit.minisig"
          ( cd "$ota/http" && sha256sum "$(basename "$ota_kit")" > RELEASE-SHA256SUMS-webui.txt )
          minisign -Sm "$ota/http/RELEASE-SHA256SUMS-webui.txt" -s "$RUNNER_TEMP/ota.key" \
            -x "$ota/http/RELEASE-SHA256SUMS-webui.txt.minisig"
          printf 'untrusted\n' > "$ota/releases-data.json.minisig"
          home="$RUNNER_TEMP/ota/neg-badmanifest"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18135
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && break
            sleep 0.5
          done
          check_code="$(curl -sS -o "$home/check.json" -w '%{http_code}' \
            "http://127.0.0.1:$ui_port/api/update-check" || true)"
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          echo "neg bad-manifest HTTP $check_code: $(cat "$home/check.json" 2>/dev/null || true)"
          if [ "$check_code" = "200" ] && grep -q '"success":true' "$home/check.json" 2>/dev/null; then
            echo "bad releases.minisig must not yield a successful update-check" >&2
            exit 1
          fi
          echo "PASS: bad releases manifest signature rejected"

      - name: Negative - read-only install dir must fail closed (OTA permission pre-flight)
        if: matrix.negatives
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          # The bad-manifest step broke releases-data.json.minisig; restore a
          # valid signature over the canonical manifest so update-check works
          # and the only failure cause in this round is the directory mode.
          minisign -Sm "$ota/releases-canonical.json" -s "$RUNNER_TEMP/ota.key" \
            -x "$ota/releases-data.json.minisig"
          chmod 0555 "$ota/install/bin"
          before_sha="$(sha256sum "$ota/install/bin/wptsall-client" | awk '{print $1}')"
          home="$RUNNER_TEMP/ota/neg-rodir"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18136
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          [ "$ready" = "1" ] || { cat "$home/stdout.log" 2>/dev/null || true; \
            echo "client did not start from read-only dir (exec bit must remain)" >&2; exit 1; }
          curl -sS -o "$home/perform.json" -X POST "http://127.0.0.1:$ui_port/api/perform-update" || true
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          echo "neg readonly-dir: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            && { echo "read-only install dir must not report a successful update" >&2; exit 1; }
          grep -q 'INSTALL_DIR_NOT_WRITABLE' "$home/perform.json" \
            || { echo "must surface the INSTALL_DIR_NOT_WRITABLE error code" >&2; exit 1; }
          after_sha="$(sha256sum "$ota/install/bin/wptsall-client" | awk '{print $1}')"
          [ "$before_sha" = "$after_sha" ] \
            || { echo "read-only install dir must leave the binary byte-identical" >&2; exit 1; }
          chmod 0755 "$ota/install/bin"
          echo "PASS: read-only install dir fails closed (INSTALL_DIR_NOT_WRITABLE, binary untouched)"

      - name: Recovery - writable dir self-replace swaps the binary
        if: matrix.negatives
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          before_mtime="$(stat -c %Y "$ota/install/bin/wptsall-client")"
          home="$RUNNER_TEMP/ota/pos-recovery"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18137
          WPTSALL_WEB_UI=1 \
          WPTSALL_SERVER_BASE="http://127.0.0.1:$OTA_SERVER_PORT" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          [ "$ready" = "1" ] || { cat "$home/stdout.log" "$home/client.log" 2>/dev/null || true; \
            echo "client did not start" >&2; exit 1; }
          code="$(curl -sS -o "$home/perform.json" -w '%{http_code}' -X POST \
            "http://127.0.0.1:$ui_port/api/perform-update" || true)"
          echo "recovery perform-update HTTP $code: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            || { echo "recovery: perform-update must succeed after chmod 0755" >&2; exit 1; }
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          swapped=0
          for _ in $(seq 1 60); do
            now_mtime="$(stat -c %Y "$ota/install/bin/wptsall-client" 2>/dev/null || echo -1)"
            if [ "$now_mtime" != "$before_mtime" ] && [ "$now_mtime" != "-1" ]; then swapped=1; break; fi
            sleep 0.5
          done
          [ "$swapped" = "1" ] \
            || { echo "recovery: self-replace must swap the binary once writable" >&2; exit 1; }
          file "$ota/install/bin/wptsall-client" | grep -qi ELF \
            || { echo "recovery: swapped binary must be ELF" >&2; exit 1; }
          echo "PASS: recovery self-replace swaps the binary after permissions are restored"

      - name: Stop releases server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ota/serve.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ota/serve.pid")" 2>/dev/null || true
          fi

  ota-github-public:
    name: Public-channel OTA round (real GitHub release URLs)
    # Fork pull_requests cannot create releases; the mechanism lane above
    # still runs for them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-wpplugin/source/frontend/package-lock.json

      - name: Build WebUI frontend
        working-directory: client-wpplugin/source/frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-wpplugin/source

      - name: Install minisign
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* || true
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v

      - name: Generate ephemeral signing keypair
        id: keygen
        run: |
          set -euo pipefail
          minisign -G -W -p "$RUNNER_TEMP/ota.pub" -s "$RUNNER_TEMP/ota.key"
          pubkey="$(grep -m1 '^RW' "$RUNNER_TEMP/ota.pub")"
          echo "embedded pubkey: $pubkey"
          echo "pubkey=$pubkey" >> "$GITHUB_OUTPUT"

      - name: Release build with embedded ephemeral key
        env:
          WPTSALL_MINISIGN_PUBKEY: ${{ steps.keygen.outputs.pubkey }}
        run: cargo build --release --bin wptsall-client --manifest-path client-wpplugin/source/Cargo.toml

      - name: Assemble kit and manifest pointing at real GitHub asset URLs
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ota.key"
          work="$RUNNER_TEMP/ota"
          tag="ota-ci-$GITHUB_RUN_ID"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          rm -rf "$work" && mkdir -p "$work/http" "$work/install/bin" "$work/install/ui/webui"
          version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          plat="linux-$(uname -m)"

          echo "OTA_TAG=$tag" >> "$GITHUB_ENV"
          echo "OTA_BASE=$base" >> "$GITHUB_ENV"

          cp client-wpplugin/source/target/release/wptsall-client "$work/install/bin/"
          echo "$version" > "$work/install/VERSION-WEBUI"
          cp -r client-wpplugin/source/frontend/dist/. "$work/install/ui/webui/"

          kit_root="wptsall-client-webui"
          mkdir -p "$work/$kit_root/bin"
          cp client-wpplugin/source/target/release/wptsall-client "$work/$kit_root/bin/"
          echo "$version" > "$work/$kit_root/VERSION"
          echo "$version" > "$work/$kit_root/VERSION-BINARY"
          echo "$plat" > "$work/$kit_root/PLATFORM.txt"
          ( cd "$work" && tar -czf "http/kit-webui-$plat.tar.gz" "$kit_root" )
          kit="$work/http/kit-webui-$plat.tar.gz"
          minisign -Sm "$kit" -s "$key" -x "$kit.minisig"

          sums="$work/http/RELEASE-SHA256SUMS-webui.txt"
          ( cd "$work/http" && sha256sum "$(basename "$kit")" > "$(basename "$sums")" )
          minisign -Sm "$sums" -s "$key" -x "$sums.minisig"

          # releases.json asset = the wire shape ({"success":true,"data":…});
          # the .minisig covers the canonicalized inner data object.
          data="$work/releases-data.json"
          python3 - "$data" "$base" <<'PY'
          import json, sys
          out, base = sys.argv[1], sys.argv[2]
          data = {
            "schema_version": 1,
            "generated_at": "2026-09-08T00:00:00Z",
            "products": {
              "client-wpplugin": {
                "latest_version": "99.0.0",
                "min_supported_version": "2.0.0",
                "release_notes_url": f"{base}/notes",
                "download_url_template": f"{base}/kit-webui-linux-x86_64.tar.gz",
                "signature_url_template": f"{base}/RELEASE-SHA256SUMS-webui.txt.minisig",
                "mandatory": False,
              }
            },
          }
          json.dump(data, open(out, "w"), indent=2)
          PY
          wrapper="$work/http/releases.json"
          python3 - "$data" "$wrapper" <<'PY'
          import json, sys
          data = json.loads(open(sys.argv[1]).read())
          json.dump({"success": True, "data": data}, open(sys.argv[2], "w"), indent=2)
          PY
          canon="$work/releases-canonical.json"
          python3 - "$data" "$canon" <<'PY'
          import json, sys
          def sortv(v):
            if isinstance(v, dict): return {k: sortv(v[k]) for k in sorted(v)}
            if isinstance(v, list): return [sortv(i) for i in v]
            return v
          raw = json.loads(open(sys.argv[1]).read())
          open(sys.argv[2], "wb").write(json.dumps(
            sortv(raw), ensure_ascii=False, separators=(",", ":"), allow_nan=False
          ).encode("utf-8"))
          PY
          minisign -Sm "$canon" -s "$key" -x "$work/http/releases.json.minisig"
          ls -la "$work/http"

      - name: Publish ephemeral prerelease with the signed assets
        run: |
          set -euo pipefail
          gh release create "$OTA_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "OTA CI self-test $GITHUB_RUN_ID" \
            --notes "Ephemeral self-test release for the public-channel OTA lane. Signed with a throwaway key; auto-removed when the run finishes." \
            "$RUNNER_TEMP/ota/http"/*
          echo "prerelease $OTA_TAG published"

      - name: Full update round against the real GitHub URLs
        run: |
          set -euo pipefail
          ota="$RUNNER_TEMP/ota"
          home="$ota/pub"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18141
          bin="$ota/install/bin/wptsall-client"
          before_mtime="$(stat -c %Y "$bin")"
          # WPTSALL_RELEASES_URL points straight at the real releases.json
          # asset; no local server is involved anywhere in this round.
          WPTSALL_WEB_UI=1 \
          WPTSALL_RELEASES_URL="$OTA_BASE/releases.json" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$bin" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          [ "$ready" = "1" ] || { cat "$home/stdout.log" "$home/client.log" 2>/dev/null || true; \
            echo "client did not start" >&2; exit 1; }

          check="$(curl -fsS "http://127.0.0.1:$ui_port/api/update-check")"
          echo "update-check (real GitHub URL): $check"
          echo "$check" | grep -q '"update_available":true' \
            || { echo "expected update_available true against the real manifest" >&2; exit 1; }

          code="$(curl -sS -o "$home/perform.json" -w '%{http_code}' -X POST \
            "http://127.0.0.1:$ui_port/api/perform-update" || true)"
          echo "perform-update HTTP $code: $(cat "$home/perform.json")"
          grep -q '"success":true' "$home/perform.json" \
            || { echo "perform-update against the real GitHub kit did not succeed" >&2; exit 1; }

          swapped=0
          for _ in $(seq 1 60); do
            now_mtime="$(stat -c %Y "$bin" 2>/dev/null || echo -1)"
            if [ "$now_mtime" != "$before_mtime" ] && [ "$now_mtime" != "-1" ]; then swapped=1; break; fi
            sleep 0.5
          done
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          [ "$swapped" = "1" ] \
            || { echo "self-replace did not swap the staged binary" >&2; exit 1; }

          ui_port=18142
          WPTSALL_WEB_UI=1 \
          WPTSALL_RELEASES_URL="$OTA_BASE/releases.json" \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$bin" > "$home/stdout2.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          [ "$ready" = "1" ] || { cat "$home/stdout2.log" "$home/client.log" 2>/dev/null || true; \
            echo "replaced binary failed to start" >&2; exit 1; }
          echo "PASS: public-channel OTA round from real GitHub URLs (download → verify → self-replace → cold start)"

      - name: Default-channel smoke - pinned release key vs the real latest release
        run: |
          set -euo pipefail
          # Rebuild WITHOUT the ephemeral key so the pinned public release
          # key applies (build.rs fallback in this tree).
          cargo build --release --bin wptsall-client --manifest-path client-wpplugin/source/Cargo.toml
          default_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/releases.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$default_url" || true)"
          if [ "$code" != "200" ]; then
            echo "no published release yet (HTTP $code at $default_url) — default-channel smoke skipped"
            exit 0
          fi
          ota="$RUNNER_TEMP/ota"
          home="$ota/def"; rm -rf "$home" && mkdir -p "$home/data"
          ui_port=18143
          # No WPTSALL_SERVER_BASE, no WPTSALL_RELEASES_URL: the client must
          # use the built-in default channel by itself.
          WPTSALL_WEB_UI=1 \
          WPTSALL_WEB_UI_BIND="127.0.0.1:$ui_port" \
          WPTSALL_WEB_UI_PORT="$ui_port" \
          WPTSALL_DATA_DIR="$home/data" \
          WPTSALL_DB_PATH="$home/wptsall.db" \
          WPTSALL_LOG_FILE="$home/client.log" \
          WPTSALL_INSTALL_ROOT="$ota/install" \
            "$ota/install/bin/wptsall-client" > "$home/stdout.log" 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$ui_port/api/status" >/dev/null 2>&1 && { ready=1; break; }
            sleep 0.5
          done
          [ "$ready" = "1" ] || { cat "$home/stdout.log" "$home/client.log" 2>/dev/null || true; \
            echo "client did not start" >&2; exit 1; }
          check="$(curl -fsS "http://127.0.0.1:$ui_port/api/update-check")"
          echo "default-channel update-check: $check"
          kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true
          echo "$check" | grep -q '"success":true' \
            || { echo "default-channel update-check must verify the real published manifest" >&2; exit 1; }
          echo "PASS: default public channel verifies (pinned release key, real latest release)"

      - name: Delete the ephemeral prerelease
        if: always()
        run: |
          gh release delete "$OTA_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            2>/dev/null || echo "prerelease $OTA_TAG already gone"
