name: Multi-OS build and package
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  # Keep earlier owned candidates running so failures and completed platform
  # evidence are not erased by a packaging-only correction.
  cancel-in-progress: false
jobs:
  package:
    name: ${{ matrix.product }} kit and native package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        product: [webui, desktop]
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, kind: deb }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, kind: deb }
          - { os: windows-latest, platform: windows-x86_64, kind: nsis }
          - { os: windows-11-arm, platform: windows-aarch64, kind: nsis }
          - { os: macos-latest, platform: darwin-aarch64, kind: dmg }
          - { os: macos-15-intel, platform: darwin-x86_64, kind: dmg }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client-wpplugin/source/frontend/package-lock.json
            client-desktop/frontend/package-lock.json
      - name: Build production WebUI
        working-directory: client-wpplugin/source/frontend
        run: npm ci && npm run check && npm run build
      - name: Build production Desktop UI
        if: matrix.product == 'desktop'
        working-directory: client-desktop/frontend
        run: npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && matrix.product == 'desktop'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - name: Install Windows native packager
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundled = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (Test-Path $bundled) {
            Split-Path $bundled | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            exit 0
          }
          # Chocolatey's community feed returns 503 often enough to fail the
          # Windows package jobs. The official zip does not use that feed.
          $root = Join-Path $env:RUNNER_TEMP 'nsis'
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $downloaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            & curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 5 --output $zip $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and ((Get-Item $zip).Length -gt 1000000)) {
              $downloaded = $true
              break
            }
            if ($attempt -eq 4) { throw 'NSIS download failed' }
            Start-Sleep -Seconds (10 * $attempt)
          }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $exe = Join-Path $root 'nsis-3.11\Bin\makensis.exe'
          if (-not (Test-Path $exe)) { throw 'NSIS executable missing after installation' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client-wpplugin/source
            client-desktop/src-tauri
      - name: Compile production release binary
        env:
          PRODUCT: ${{ matrix.product }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          if [ "$PRODUCT" = webui ]; then
            cargo build --locked --release --bin wptsall-client --manifest-path client-wpplugin/source/Cargo.toml
          else
            cargo build --locked --release --features custom-protocol --manifest-path client-desktop/src-tauri/Cargo.toml
          fi
      - name: Assemble validated kit and native installer
        env:
          PRODUCT: ${{ matrix.product }}
          PLATFORM: ${{ matrix.platform }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          ext=''
          [ "$RUNNER_OS" != Windows ] || ext='.exe'
          if [ "$PRODUCT" = webui ]; then
            binary="client-wpplugin/source/target/release/wptsall-client$ext"
            ui="client-wpplugin/source/frontend/dist"
          else
            binary="client-desktop/src-tauri/target/release/wptsall-desktop$ext"
            ui="client-desktop/frontend/dist"
          fi
          python install-client/packaging/assemble-kit.py "$PRODUCT" --binary "$binary" --ui "$ui" \
            --version "$version" --platform "$PLATFORM" --triple "$triple" --out "$RUNNER_TEMP/kits"
          python install-client/packaging/native-pack.py "$PRODUCT" \
            --kit "$RUNNER_TEMP/kits/kit-$PRODUCT-$PLATFORM.tar.gz" --version "$version" \
            --kinds "portable,$KIND" --out "$RUNNER_TEMP/kits"
      - name: Upload current candidate products
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.product }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/kits/*
          if-no-files-found: error
