name: Production source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    name: Production builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client-wpplugin/source/frontend/package-lock.json
            client-desktop/frontend/package-lock.json
      - name: Build and type-check WebUI
        working-directory: client-wpplugin/source/frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Build and type-check Desktop UI
        working-directory: client-desktop/frontend
        run: |
          npm ci
          npm run check
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client-wpplugin/source
            client-desktop/src-tauri
      - name: Check production Rust core
        run: cargo check --locked --lib --bins --manifest-path client-wpplugin/source/Cargo.toml
      - name: Check production Desktop
        run: cargo check --locked --features custom-protocol --manifest-path client-desktop/src-tauri/Cargo.toml
