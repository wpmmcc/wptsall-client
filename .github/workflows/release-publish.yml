name: Release publish
on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Exact-commit full-scope private acceptance JSON
        required: true
        type: string
      acceptance_signature:
        description: Minisign signature of the acceptance JSON using the pinned release key
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-publish
  cancel-in-progress: false
env:
  RELEASE_PUBKEY_B64: RWRK0RTOL1wb3YAJ6sywCLsN0kvpOttJ1CYv3AHluZAfYUXzSEm/0cSw
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require default-branch HEAD and an unused exact version
        run: |
          set -euo pipefail
          branch="$(gh api "repos/{owner}/{repo}" --jq .default_branch)"
          head="$(gh api "repos/{owner}/{repo}/branches/$branch" --jq .commit.sha)"
          [ "$GITHUB_REF_NAME" = "$branch" ] && [ "$GITHUB_SHA" = "$head" ]
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Listing refs distinguishes a free tag from an API/auth failure.
          gh api --paginate "repos/{owner}/{repo}/git/matching-refs/tags/v$version" > "$RUNNER_TEMP/refs.json"
          VERSION="$version" python3 - <<'PY'
          import json, os
          refs = json.load(open(os.environ["RUNNER_TEMP"] + "/refs.json"))
          assert not any(r["ref"] == "refs/tags/v" + os.environ["VERSION"] for r in refs), "version already tagged"
          PY
      - name: Require completed successful current-commit production workflows
        run: |
          set -euo pipefail
          for workflow in ci.yml build-matrix.yml; do
            gh api "repos/{owner}/{repo}/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
            python3 - <<'PY'
          import json, os
          runs = json.load(open(os.environ["RUNNER_TEMP"] + "/runs.json"))["workflow_runs"]
          assert runs, "missing current-commit push workflow"
          latest = max(runs, key=lambda r: (r["run_number"], r["run_attempt"]))
          assert latest["status"] == "completed" and latest["conclusion"] == "success", "latest attempt is not green"
          PY
          done
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signed full-scope private acceptance
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
          SIGNATURE: ${{ inputs.acceptance_signature }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCEPTANCE" > "$RUNNER_TEMP/acceptance.json"
          printf '%s\n' "$SIGNATURE" > "$RUNNER_TEMP/acceptance.json.minisig"
          minisign -Vm "$RUNNER_TEMP/acceptance.json" -P "$RELEASE_PUBKEY_B64"
          python3 install-client/packaging/release-acceptance.py "$RUNNER_TEMP/acceptance.json" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --version "$(tr -d '\r\n' < VERSION)"
  build-products:
    needs: gate
    uses: ./.github/workflows/build-matrix.yml
  publish:
    needs: build-products
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Assert workflow and binary pin the same public release key
        run: grep -F "$RELEASE_PUBKEY_B64" libs/wptsall-client-security/build.rs
      - name: Prepare and verify all signed candidate products
        env:
          RELEASE_KEY: ${{ secrets.WPTSALL_RELEASE_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          python3 install-client/packaging/prepare-release.py --assets "$RUNNER_TEMP/release" \
            --version "$(tr -d '\r\n' < VERSION)" --repository "$GITHUB_REPOSITORY" \
            --tag "v$(tr -d '\r\n' < VERSION)" --key "$key" --public-key "$RELEASE_PUBKEY_B64"
      - name: Recheck HEAD and publish exactly this commit
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          branch="$(gh api "repos/{owner}/{repo}" --jq .default_branch)"
          [ "$(gh api "repos/{owner}/{repo}/branches/$branch" --jq .commit.sha)" = "$GITHUB_SHA" ]
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$(tr -d '\r\n' < VERSION)" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "WPTSALL $(tr -d '\r\n' < VERSION)" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release"/*
      - name: Verify live default-channel manifest and signature
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/releases.json"
          curl --fail --location --retry 10 --retry-all-errors --retry-delay 2 "$url" -o "$RUNNER_TEMP/live.json"
          curl --fail --location --retry 10 --retry-all-errors --retry-delay 2 "$url.minisig" -o "$RUNNER_TEMP/live.minisig"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "live.json").read_bytes())["data"]
          (root / "live.canonical").write_bytes(json.dumps(data, sort_keys=True, ensure_ascii=False, separators=(",", ":"), allow_nan=False).encode())
          expected = json.loads((root / "release/releases.json").read_bytes())["data"]
          assert data == expected, "latest channel does not expose this release"
          PY
          minisign -Vm "$RUNNER_TEMP/live.canonical" -x "$RUNNER_TEMP/live.minisig" -P "$RELEASE_PUBKEY_B64"
